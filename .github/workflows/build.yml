name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build tools
        run: pip install -r requirements.txt
      - name: Build fonts
        run: ./scripts/build.sh
      - name: Check fonts (Fontbakery, universal profile)
        run: fontbakery check-universal --succinct -l WARN --html fontbakery-report.html fonts/otf/*.otf fonts/ttf/*.ttf
        continue-on-error: true
      - name: Upload fonts and report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arede-grotesk-fonts
          path: |
            fonts/
            fontbakery-report.html
