name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.0 (creates the tag v<version> on main)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve version and tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            TAG="v$VERSION"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Arede Grotesk $VERSION"
            git push origin "$TAG"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build tools
        run: pip install -r requirements.txt
      - name: Build fonts
        run: ./scripts/build.sh
      - name: Package
        run: |
          PKG="AredeGrotesk-$VERSION"
          mkdir -p "dist/$PKG"
          cp -r fonts/otf fonts/ttf fonts/webfonts "dist/$PKG/"
          cp OFL.txt README.md CHANGELOG.md "dist/$PKG/"
          (cd dist && zip -r "$PKG.zip" "$PKG")
          echo "PKG=$PKG" >> "$GITHUB_ENV"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/$PKG.zip" --clobber
          else
            gh release create "$TAG" "dist/$PKG.zip" \
              --title "Arede Grotesk $TAG" \
              --notes-file .github/release-notes.md \
              --verify-tag
          fi
