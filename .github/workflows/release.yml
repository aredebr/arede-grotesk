name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.0 (creates the tag v<version> on main)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
      - name: Release notes from CHANGELOG
        run: |
          mkdir -p dist
          ./scripts/release_notes.sh "$VERSION" > dist/release-notes.md
          cat dist/release-notes.md
      - name: Create tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Arede Grotesk $VERSION"
          git push origin "$TAG"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build tools
        run: pip install -r requirements.txt
      - name: Build fonts
        run: ./scripts/build.sh
      - name: Package
        run: |
          PKG="AredeGrotesk-$VERSION"
          mkdir -p "dist/$PKG"
          cp -r fonts/otf fonts/ttf fonts/webfonts "dist/$PKG/"
          cp OFL.txt README.md CHANGELOG.md "dist/$PKG/"
          (cd dist && zip -r "$PKG.zip" "$PKG")
          echo "PKG=$PKG" >> "$GITHUB_ENV"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/$PKG.zip" --clobber
          else
            gh release create "$TAG" "dist/$PKG.zip" \
              --title "Arede Grotesk $TAG" \
              --notes-file dist/release-notes.md \
              --verify-tag
          fi
